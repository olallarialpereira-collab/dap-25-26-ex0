name: Build and Push Docker Image

on:     
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen Docker personalizada
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/dap-postgres-world:latest .

      - name: Empujar imagen a Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/dap-postgres-world:latest